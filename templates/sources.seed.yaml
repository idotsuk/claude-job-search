# Job-search source registry. Read + updated every /job-search run.
#
# This seed ships with only the three tier-1 sources. The registry grows
# itself: step 3d of the skill discovers new candidate sources every run,
# step 3c smoke-tests them in probation, and yield metrics promote or drop
# them. Expect the tier-2 section to fill in over your first 3-5 runs.
#
# Tiers:
#   1          = must sweep every run (high-value, low-cost). Exempt from demotion.
#   2          = sweep every run + measure for rotation
#   probation  = smoke-test (1 query) on next run; promote if it yields >=1 valid listing,
#                drop after 2 consecutive zero-yield runs
#   dropped    = no longer swept; kept for memory / audit trail
#
# Conventions:
#   - last_yield     = listings *added* from this source in the most recent run
#   - cumulative_yield = lifetime listings traced to this source
#   - consecutive_zeroes = runs in a row with last_yield == 0 AND last_status == empty (drives demotion)
#   - unreachable_streak = consecutive runs in a row where last_status == unreachable (separate demotion path)
#   - runs_active    = number of runs this source has been swept in
#   - last_tried     = ISO date of last sweep
#   - last_status    = success | empty | unreachable
#                      success     = crawl worked, yielded >=1 listing
#                      empty       = crawl worked, 0 listings — counts toward consecutive_zeroes
#                      unreachable = HTTP 4xx/5xx, SPA-blocked, Cloudflare/anti-bot, tool error
#                                    → does NOT increment consecutive_zeroes; tracked in unreachable_streak instead.
#                                    Demote with reason "tooling-blocked" at unreachable_streak >= 3.
#
# Listing files MUST cite a source ID in their `source:` frontmatter (e.g. `source: linkedin_authenticated`)
# so that scripts/source_yield.py can attribute new listings back to here.

last_updated: null

sources:
  # ──────── Tier 1: always sweep ────────
  - id: linkedin_authenticated
    tier: 1
    type: linkedin_search
    runtime: playwright_logged_in_session   # scripts/linkedin_sweep.py; keywords from config.yaml search.linkedin
    notes: ""
    last_tried: null
    last_yield: 0
    cumulative_yield: 0
    runs_active: 0
    consecutive_zeroes: 0
    unreachable_streak: 0
    last_status: null

  - id: gmail_inbox
    tier: 1
