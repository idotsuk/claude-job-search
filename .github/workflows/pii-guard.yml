name: PII guard

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if tracked files contain phone numbers or personal emails
        run: |
          # Scan everything tracked except *.example templates (which hold
          # deliberately fake placeholder contact details).
          files=$(git ls-files | grep -v '\.example$' || true)
          bad=0
          # International phone numbers (7+ digits after a country code)
          if echo "$files" | xargs grep -nE '\+[0-9][0-9 ()-]{7,}[0-9]' -- 2>/dev/null; then bad=1; fi
          # Email addresses outside known-safe placeholder domains
          if echo "$files" | xargs grep -nEi '[a-z0-9._%+-]+@(?!example\.com|users\.noreply)[a-z0-9.-]+\.[a-z]{2,}' -P -- 2>/dev/null | grep -v 'noreply@anthropic.com'; then bad=1; fi
          if [ "$bad" -ne 0 ]; then
            echo '::error::Possible PII found in tracked files (see matches above).'
            exit 1
          fi
          echo 'No PII patterns found.'
